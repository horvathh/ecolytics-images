<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ecolytics product loop</title>
<style>
  html, body { margin: 0; height: 100%; background: #FFFFFF; overflow: hidden; }
  video { display: block; width: 100%; height: 100%; object-fit: cover; background: #FFFFFF; }
</style>
</head>
<body>
<video id="loop" muted autoplay loop playsinline preload="auto"
       poster="product-loop-poster.jpg"
       aria-label="Ecolytics product walkthrough: B Corp action plan, environmental data, recommendations, social and governance tools, and public impact page"></video>
<script>
  (function () {
    var v = document.getElementById('loop');
    // The frame is small on phones, so load the lighter 720p file there.
    v.src = (window.innerWidth < 900 ? 'product-loop-720p.mp4' : 'product-loop-1080p.mp4');
    v.muted = true;
    var p = v.play();
    if (p && p.catch) p.catch(function () { v.controls = true; });
  })();
</script>
</body>
</html>
